version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: turnoverdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d turnoverdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/turnoverdb}
      - SECRET_KEY=${SECRET_KEY:-my-very-long-random-secret-key}
      - DB_HOST=postgres
      - DB_PORT=5432
      - ENV=development
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
    depends_on:
      - backend

volumes:
  postgres_data: